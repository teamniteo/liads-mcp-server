[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-ads-mcp"
version = "0.1.0"
description = "MCP server for LinkedIn Ads: reads, and writes as previewed plans applied after one approval, with drafts by default and budget caps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.14,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
linkedin-ads-mcp = "linkedin_ads_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_ads_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
